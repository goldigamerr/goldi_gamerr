<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b20">
<title>FF Reward Hub</title>
<style>
:root{
  --bg:#071a20;
  --bg2:#0b242b;
  --panel:rgba(48,82,92,.72);
  --cyan:#00eaf4;
  --cyan-soft:rgba(0,234,244,.20);
  --pink:#ff49d2;
  --text:#f8fbfc;
  --muted:#d5dde0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}

.app{
  min-height:100vh;
  padding:34px 14px 80px;
  background:
    radial-gradient(circle at 50% 24%,rgba(0,234,244,.055),transparent 29%),
    linear-gradient(180deg,#071b21 0%,#0a242b 55%,#071a20 100%);
}
.header{text-align:center}
.title{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(38px,8.3vw,66px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:-1.7px;
  color:var(--cyan);
  text-shadow:0 0 8px rgba(0,234,244,.42);
}

.insta{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:38px 0 27px;
  font-size:clamp(25px,5.6vw,39px);
  line-height:1;
  font-weight:700;
  color:var(--pink);
  text-shadow:0 0 8px rgba(255,73,210,.18);
}
.insta-icon{
  width:43px;height:43px;flex:0 0 43px;border-radius:12px;
  background:linear-gradient(135deg,#6c22ff 5%,#ef168d 53%,#ffad18 100%);
  position:relative;box-shadow:0 0 10px rgba(255,73,210,.25);
}
.insta-icon:before{
  content:"";position:absolute;left:9px;top:9px;width:22px;height:22px;
  border:3px solid #fff;border-radius:7px;
}
.insta-icon:after{
  content:"";position:absolute;right:11px;top:11px;width:5px;height:5px;
  border:2px solid #fff;border-radius:50%;
}

.hub{
  width:min(760px,100%);
  margin:auto;
  padding:30px 30px 27px;
  border-radius:27px;
  background:var(--panel);
  border:1px solid rgba(80,190,199,.12);
  box-shadow:0 7px 25px rgba(0,0,0,.13),0 0 22px rgba(0,234,244,.10) inset;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}
.card{
  position:relative;
  display:block;
  width:100%;
  aspect-ratio:1;
  padding:0;
  overflow:hidden;
  border:0;
  border-radius:18px;
  background:#050708;
  box-shadow:0 4px 11px rgba(0,0,0,.16);
  transition:transform .16s ease,box-shadow .16s ease;
}
.card img{
  width:100%;height:100%;display:block;
  object-fit:cover;
  image-rendering:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.card:active{transform:scale(.975)}
.card.selected{
  box-shadow:0 0 0 3px #fff,0 0 12px rgba(0,234,244,.72);
}
.card.selected:after{
  content:"✓";
  position:absolute;right:7px;top:7px;
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(0,15,18,.82);
  color:#fff;font-size:17px;font-weight:800;
  box-shadow:0 0 8px rgba(0,234,244,.45);
}

.uid-wrap{margin:30px auto 18px;max-width:600px}
.uid{
  width:100%;height:58px;
  border:2px solid var(--cyan);
  border-radius:30px;
  background:#eef3fb;
  color:#111;
  padding:0 22px;
  outline:none;
  text-align:center;
  font-size:19px;
  box-shadow:0 0 10px rgba(0,234,244,.16);
}
.uid::placeholder{color:#6b7478}
.uid:focus{box-shadow:0 0 0 3px rgba(0,234,244,.11),0 0 14px rgba(0,234,244,.23)}

.claim{
  display:block;width:min(88%,600px);height:67px;margin:0 auto;
  border:0;border-radius:36px;
  color:#fff;font-size:28px;font-weight:700;
  background:linear-gradient(100deg,#10d9e6 0%,#1259ff 100%);
  box-shadow:0 5px 15px rgba(0,0,0,.12),0 0 10px rgba(0,234,244,.14);
  transition:transform .16s ease,filter .16s ease;
}
.claim:hover{filter:brightness(1.045)}
.claim:active{transform:scale(.985)}
.hint{text-align:center;color:var(--muted);font-size:19px;margin:20px 0 0}

.gear{
  position:fixed;right:16px;bottom:18px;z-index:30;
  width:54px;height:54px;border-radius:50%;
  border:2px solid var(--cyan);
  background:#07191f;color:#fff;
  display:grid;place-items:center;
  font-size:25px;line-height:1;
  box-shadow:0 0 10px rgba(0,234,244,.30);
}

.toast{
  position:fixed;left:50%;bottom:82px;z-index:100;
  transform:translate(-50%,15px);opacity:0;pointer-events:none;
  background:#061116;color:#fff;
  border:1px solid var(--cyan);border-radius:12px;
  padding:10px 16px;font-size:14px;
  box-shadow:0 0 14px rgba(0,234,244,.28);
  transition:.2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Admin */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,5,8,.82);display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.admin{
  width:min(920px,100%);max-height:92vh;overflow:auto;
  background:#08181e;border:2px solid var(--cyan);border-radius:24px;
  box-shadow:0 0 22px rgba(0,234,244,.26);padding:18px;
}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.admin h2{margin:0;color:var(--cyan);font-size:clamp(21px,5vw,32px)}
.back,.reset{
  border:1px solid rgba(0,234,244,.65);border-radius:16px;
  background:#0a242b;color:#fff;padding:8px 13px;
}
.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.admin-item{background:#0d262d;border:1px solid rgba(0,234,244,.25);border-radius:15px;padding:9px}
.admin-preview{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000}
.file-label{display:block;margin-top:8px;text-align:center;border:1px solid var(--cyan);border-radius:10px;padding:8px;font-size:13px}
.file-label input{display:none}
.url{width:100%;height:38px;margin-top:7px;border-radius:9px;border:1px solid rgba(0,234,244,.65);background:#061217;color:#fff;padding:0 9px;outline:none;font-size:12px}
.admin-actions{display:flex;gap:10px;justify-content:center;margin-top:17px}
.save{border:0;border-radius:18px;padding:11px 22px;color:#fff;background:linear-gradient(100deg,#10d9e6,#1259ff);font-weight:700}

/* Success is on the same page so GitHub Pages can never 404 because success.html is missing. */
.success-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,7,10,.93);overflow:hidden}
.success-modal.show{display:flex}
.success-rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fall{position:absolute;top:-70px;left:var(--left);font-size:var(--size);animation:fall var(--duration) linear var(--delay) infinite;opacity:.9}
@keyframes fall{0%{transform:translate3d(0,-90px,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(360deg);opacity:.08}}
.success-box{
  position:relative;z-index:2;width:min(94vw,620px);
  padding:42px 22px 36px;min-height:330px;
  border:3px solid var(--cyan);border-radius:28px;
  background:#02080b;text-align:center;
  box-shadow:0 0 20px rgba(0,234,244,.42),inset 0 0 20px rgba(0,234,244,.035);
}
.success-emoji{font-size:62px;line-height:1;margin-bottom:12px}
.success-title{margin:7px 0 15px;color:var(--cyan);font-size:clamp(42px,10vw,68px);font-weight:800;text-shadow:0 0 10px rgba(0,234,244,.7)}
.success-sub{font-size:clamp(19px,4.5vw,30px);color:#f0f3f4}
.success-back{margin-top:26px;border:1px solid var(--cyan);border-radius:18px;padding:9px 19px;background:#081d23;color:#fff}

@media(max-width:700px){
  .app{padding:26px 10px 78px}
  .title{font-size:40px;letter-spacing:-1.4px}
  .insta{margin:31px 0 23px;font-size:28px;gap:12px}
  .insta-icon{width:40px;height:40px;flex-basis:40px}
  .hub{padding:22px 17px 23px;border-radius:23px}
  .grid{gap:15px}
  .card{border-radius:15px}
  .uid-wrap{margin-top:25px}
  .uid{height:54px;font-size:17px}
  .claim{height:62px;font-size:24px;width:88%}
  .hint{font-size:17px;margin-top:18px}
}
@media(max-width:430px){
  .app{padding-left:9px;padding-right:9px}
  .hub{padding:18px 12px 20px}
  .grid{gap:12px}
  .card{border-radius:13px}
  .claim{font-size:22px}
  .admin-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main class="app" id="homePage">
  <header class="header">
    <h1 class="title">FF REWARD HUB</h1>
    <div class="insta"><span class="insta-icon" aria-hidden="true"></span><span>@goldi_gamerr</span></div>
  </header>

  <section class="hub">
    <div class="grid" id="rewardGrid"></div>
    <div class="uid-wrap">
      <input id="uid" class="uid" inputmode="numeric" maxlength="20" placeholder="Enter Game UID" aria-label="Game UID">
    </div>
    <button id="claim" class="claim" type="button">CLAIM REWARD</button>
    <p class="hint">✨ Tap any reward card to select ✨</p>
  </section>
</main>

<button class="gear" id="adminOpen" type="button" aria-label="Open Admin Panel">⚙</button>
<div class="toast" id="toast" role="status"></div>

<!-- Admin panel -->
<div class="modal" id="adminModal" aria-hidden="true">
  <section class="admin">
    <div class="admin-head">
      <h2>ADMIN PANEL</h2>
      <button class="back" id="adminBack" type="button">Back</button>
    </div>
    <div class="admin-grid" id="adminGrid"></div>
    <div class="admin-actions">
      <button class="save" id="saveChanges" type="button">Save Changes</button>
      <button class="reset" id="resetImages" type="button">Reset Images</button>
    </div>
  </section>
</div>

<!-- Integrated success screen: no second HTML page, so no GitHub Pages 404. -->
<div class="success-modal" id="successModal" aria-hidden="true">
  <div class="success-rain" id="successRain"></div>
  <section class="success-box">
    <div class="success-emoji">🎉 🎁</div>
    <div class="success-title">SUCCESS!</div>
    <div class="success-sub">Your reward has been claimed</div>
    <button class="success-back" id="successBack" type="button">Back to Rewards</button>
  </section>
</div>

<script>
const defaultImages = Array.from({length:9},(_,i)=>`reward_${i+1}.jpg`);
const STORAGE_KEY = "ff_reward_hub_images_v1";
const CLAIM_KEY = "claimed_items";
let images = loadImages();
let selected = new Set();

function loadImages(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(Array.isArray(saved)&&saved.length===9) return saved;
  }catch(e){}
  return [...defaultImages];
}
function saveImages(){localStorage.setItem(STORAGE_KEY,JSON.stringify(images));}
function escapeAttr(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}

function renderHome(){
  const grid=document.getElementById("rewardGrid");
  grid.innerHTML="";
  images.forEach((src,i)=>{
    const b=document.createElement("button");
    b.className="card"+(selected.has(i)?" selected":"");
    b.type="button";
    b.title=`Reward ${i+1}`;
    const img=document.createElement("img");
    img.alt=`Reward ${i+1}`;
    img.loading="eager";
    img.decoding="async";
    img.src=src;
    img.onerror=()=>{img.style.opacity=".25"};
    b.appendChild(img);
    b.onclick=()=>{
      if(selected.has(i)) selected.delete(i); else selected.add(i);
      renderHome();
    };
    grid.appendChild(b);
  });
}

function renderAdmin(){
  const grid=document.getElementById("adminGrid");
  grid.innerHTML="";
  images.forEach((src,i)=>{
    const item=document.createElement("div");
    item.className="admin-item";
    item.innerHTML=`
      <img class="admin-preview" id="preview-${i}" src="${escapeAttr(src)}" alt="Reward ${i+1}">
      <label class="file-label">Upload New Image
        <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-index="${i}">
      </label>
      <input class="url" id="url-${i}" data-index="${i}" placeholder="Image URL" value="${escapeAttr(src)}">
    `;
    grid.appendChild(item);
  });

  grid.querySelectorAll(".url").forEach(input=>{
    input.addEventListener("input",()=>{
      const i=Number(input.dataset.index);
      images[i]=input.value.trim();
      document.getElementById(`preview-${i}`).src=images[i];
      renderHome();
    });
  });

  grid.querySelectorAll('input[type="file"]').forEach(input=>{
    input.addEventListener("change",()=>{
      const file=input.files&&input.files[0];
      if(!file)return;
      const i=Number(input.dataset.index);
      compressImage(file).then(data=>{
        images[i]=data;
        document.getElementById(`preview-${i}`).src=data;
        document.getElementById(`url-${i}`).value=data;
        renderHome();
        showToast("Image updated");
      }).catch(()=>showToast("Could not read image"));
    });
  });
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1000;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*scale));
        c.height=Math.max(1,Math.round(img.height*scale));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL("image/jpeg",.90));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}

function openSuccess(){
  const modal=document.getElementById("successModal");
  modal.classList.add("show");
  modal.setAttribute("aria-hidden","false");
  makeSuccessRain();
  window.scrollTo({top:0,behavior:"instant"});
}
function closeSuccess(){
  document.getElementById("successModal").classList.remove("show");
  document.getElementById("successModal").setAttribute("aria-hidden","true");
}
function makeSuccessRain(){
  const rain=document.getElementById("successRain");
  rain.innerHTML="";
  const icons=["💎","🎁","❤️","⚡","✨","🌸","🌺","🌼","💐","🎊","🎉"];
  for(let i=0;i<42;i++){
    const el=document.createElement("span");
    el.className="fall";
    el.textContent=icons[Math.floor(Math.random()*icons.length)];
    el.style.setProperty("--left",(Math.random()*100)+"%");
    el.style.setProperty("--size",(16+Math.random()*25)+"px");
    el.style.setProperty("--duration",(3.5+Math.random()*4.5)+"s");
    el.style.setProperty("--delay",(-Math.random()*6)+"s");
    el.style.setProperty("--drift",(-80+Math.random()*160)+"px");
    rain.appendChild(el);
  }
}

document.getElementById("claim").addEventListener("click",()=>{
  const uid=document.getElementById("uid").value.trim();
  if(selected.size===0){showToast("Please select at least one reward");return}
  if(!/^\d{8,}$/.test(uid)){showToast("Game UID must contain at least 8 digits");return}

  let claims=[];
  try{claims=JSON.parse(localStorage.getItem(CLAIM_KEY)||"[]")}catch(e){claims=[]}
  const items=[...selected];
  claims.push({uid,items,time:new Date().toISOString()});
  try{localStorage.setItem(CLAIM_KEY,JSON.stringify(claims))}catch(e){}

  /* IMPORTANT: do NOT navigate to success.html. The success screen is built into this file. */
  openSuccess();
});

document.getElementById("successBack").addEventListener("click",()=>{
  closeSuccess();
  selected.clear();
  renderHome();
});

document.getElementById("adminOpen").addEventListener("click",()=>{
  renderAdmin();
  document.getElementById("adminModal").classList.add("show");
  document.getElementById("adminModal").setAttribute("aria-hidden","false");
});
document.getElementById("adminBack").addEventListener("click",()=>{
  document.getElementById("adminModal").classList.remove("show");
  document.getElementById("adminModal").setAttribute("aria-hidden","true");
});
document.getElementById("adminModal").addEventListener("click",e=>{
  if(e.target.id==="adminModal"){
    document.getElementById("adminModal").classList.remove("show");
  }
});
document.getElementById("saveChanges").addEventListener("click",()=>{
  try{saveImages();showToast("Changes saved")}catch(e){showToast("Could not save changes")}
});
document.getElementById("resetImages").addEventListener("click",()=>{
  images=[...defaultImages];
  saveImages();
  renderHome();
  renderAdmin();
  showToast("Images reset");
});

renderHome();
</script>
</body>
</html>
