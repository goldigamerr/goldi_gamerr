<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b20">
<title>FF Reward Hub</title>
<style>
:root{
  --bg:#071a20;
  --bg2:#0b242b;
  --panel:rgba(48,82,92,.72);
  --cyan:#00eaf4;
  --cyan-soft:rgba(0,234,244,.20);
  --pink:#ff49d2;
  --text:#f8fbfc;
  --muted:#d5dde0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}

.app{
  min-height:100vh;
  padding:34px 14px 80px;
  background:
    radial-gradient(circle at 50% 24%,rgba(0,234,244,.055),transparent 29%),
    linear-gradient(180deg,#071b21 0%,#0a242b 55%,#071a20 100%);
}
.header{text-align:center}
.title{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(38px,8.3vw,66px);
  line-height:1.05;
  font-weight:800;
  letter-spacing:-1.7px;
  color:var(--cyan);
  text-shadow:0 0 8px rgba(0,234,244,.42);
}

.socials{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:36px 0 26px;
  font-size:clamp(24px,5.4vw,38px);line-height:1;font-weight:700;
  color:var(--pink);text-shadow:0 0 8px rgba(255,73,210,.16);
}
.social-link{display:flex;align-items:center;justify-content:center;gap:10px}
.social-icon{width:42px;height:42px;display:block;flex:0 0 42px}
.youtube-icon{width:47px;height:34px;flex-basis:47px}


.hub{
  width:min(760px,100%);
  margin:auto;
  padding:30px 30px 27px;
  border-radius:27px;
  background:var(--panel);
  border:1px solid rgba(80,190,199,.12);
  box-shadow:0 7px 25px rgba(0,0,0,.13),0 0 22px rgba(0,234,244,.10) inset;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}
.card{
  position:relative;
  display:block;
  width:100%;
  aspect-ratio:1;
  padding:0;
  overflow:hidden;
  border:2px solid transparent;
  border-radius:18px;
  background:#050708;
  box-shadow:0 4px 11px rgba(0,0,0,.16);
  transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
}
.card img{
  width:100%;height:100%;display:block;
  object-fit:cover;
  image-rendering:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.card:active{transform:scale(.975)}
.card.selected{
  border-color:var(--cyan);
  box-shadow:0 0 0 1px rgba(0,234,244,.45),0 0 8px rgba(0,234,244,.55),0 0 16px rgba(0,234,244,.18);
}
.card.selected:after{
  content:"✓";
  position:absolute;right:6px;top:6px;
  width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(2,18,22,.82);
  color:#fff;font-size:14px;font-weight:800;
  border:1px solid rgba(0,234,244,.55);
  box-shadow:0 0 5px rgba(0,234,244,.28);
}

.uid-wrap{margin:30px auto 18px;max-width:600px}
.uid{
  width:min(58%,340px);height:48px;
  border:2px solid rgba(0,234,244,.82);
  border-radius:30px;
  background:#eef3fb;
  color:#111;
  padding:0 18px;
  outline:none;
  text-align:center;
  font-size:19px;
  box-shadow:0 0 7px rgba(0,234,244,.10);
}
.uid::placeholder{color:#6b7478}
.uid:focus{box-shadow:0 0 0 3px rgba(0,234,244,.11),0 0 14px rgba(0,234,244,.23)}

.claim{
  display:block;width:min(88%,600px);height:67px;margin:0 auto;
  border:0;border-radius:36px;
  color:#fff;font-size:28px;font-weight:700;
  background:linear-gradient(100deg,#10d9e6 0%,#1259ff 100%);
  box-shadow:0 5px 15px rgba(0,0,0,.12),0 0 10px rgba(0,234,244,.14);
  transition:transform .16s ease,filter .16s ease;
}
.claim:hover{filter:brightness(1.045)}
.claim:active{transform:scale(.985)}
.hint{text-align:center;color:var(--muted);font-size:19px;margin:20px 0 0}

.gear{
  position:fixed;left:12px;top:12px;z-index:70;
  width:42px;height:42px;border-radius:12px;
  border:1px solid rgba(0,234,244,.65);
  background:rgba(5,20,25,.88);color:#fff;
  display:grid;place-items:center;
  font-size:0;line-height:1;
  box-shadow:0 0 8px rgba(0,234,244,.18);
  backdrop-filter:blur(5px);
  touch-action:manipulation;
  pointer-events:auto;
}

.toast{
  position:fixed;left:50%;bottom:82px;z-index:100;
  transform:translate(-50%,15px);opacity:0;pointer-events:none;
  background:#061116;color:#fff;
  border:1px solid var(--cyan);border-radius:12px;
  padding:10px 16px;font-size:14px;
  box-shadow:0 0 14px rgba(0,234,244,.28);
  transition:.2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Admin */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,5,8,.82);display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.admin{
  width:min(920px,100%);max-height:92vh;overflow:auto;
  background:#08181e;border:2px solid var(--cyan);border-radius:24px;
  box-shadow:0 0 22px rgba(0,234,244,.26);padding:18px;
}
.admin-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.admin h2{margin:0;color:var(--cyan);font-size:clamp(21px,5vw,32px)}
.back,.reset{
  border:1px solid rgba(0,234,244,.65);border-radius:16px;
  background:#0a242b;color:#fff;padding:8px 13px;
}
.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.admin-item{background:#0d262d;border:1px solid rgba(0,234,244,.25);border-radius:15px;padding:9px}
.admin-preview{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000}
.file-label{display:block;margin-top:8px;text-align:center;border:1px solid var(--cyan);border-radius:10px;padding:8px;font-size:13px}
.file-label input{display:none}
.url{width:100%;height:38px;margin-top:7px;border-radius:9px;border:1px solid rgba(0,234,244,.65);background:#061217;color:#fff;padding:0 9px;outline:none;font-size:12px}
.admin-actions{display:flex;gap:10px;justify-content:center;margin-top:17px}
.save{border:0;border-radius:18px;padding:11px 22px;color:#fff;background:linear-gradient(100deg,#10d9e6,#1259ff);font-weight:700}

/* Success is on the same page so GitHub Pages can never 404 because success.html is missing. */
.success-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,7,10,.93);overflow:hidden}
.success-modal.show{display:flex}
.success-rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fall{position:absolute;top:-70px;left:var(--left);font-size:var(--size);animation:fall var(--duration) linear var(--delay) infinite;opacity:.9}
@keyframes fall{0%{transform:translate3d(0,-90px,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate3d(var(--drift),110vh,0) rotate(360deg);opacity:.08}}
.success-box{
  position:relative;z-index:2;width:min(94vw,620px);
  padding:42px 22px 36px;min-height:330px;
  border:3px solid var(--cyan);border-radius:28px;
  background:#02080b;text-align:center;
  box-shadow:0 0 20px rgba(0,234,244,.42),inset 0 0 20px rgba(0,234,244,.035);
}
.success-emoji{font-size:62px;line-height:1;margin-bottom:12px}
.success-title{margin:7px 0 15px;color:var(--cyan);font-size:clamp(42px,10vw,68px);font-weight:800;text-shadow:0 0 10px rgba(0,234,244,.7)}
.success-sub{font-size:clamp(19px,4.5vw,30px);color:#f0f3f4}
.success-back{margin-top:26px;border:1px solid var(--cyan);border-radius:18px;padding:9px 19px;background:#081d23;color:#fff}

@media(max-width:700px){
  .app{padding:26px 10px 78px}
  .title{font-size:40px;letter-spacing:-1.4px}
  .socials{margin:30px 0 22px;font-size:27px;gap:11px}
  .social-icon{width:38px;height:38px;flex-basis:38px}
  .youtube-icon{width:42px;height:30px;flex-basis:42px}
    .hub{padding:22px 17px 23px;border-radius:23px}
  .grid{gap:15px}
  .card{border-radius:15px}
  .uid-wrap{margin-top:25px}
  .uid{height:46px;font-size:16px;width:58%;min-width:210px;max-width:340px}
  .claim{height:62px;font-size:24px;width:88%}
  .hint{font-size:17px;margin-top:18px}
}
@media(max-width:700px){
  .gear{left:10px;top:10px;width:39px;height:39px;border-radius:11px}
}
@media(max-width:430px){
  .app{padding-left:9px;padding-right:9px}
  .hub{padding:18px 12px 20px}
  .grid{gap:12px}
  .card{border-radius:13px}
  .claim{font-size:22px}
  .admin-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<main class="app" id="homePage">
  <header class="header">
    <h1 class="title">FF REWARD HUB</h1>
    <div class="socials" aria-label="Social links">
      <span class="social-link" aria-label="Instagram">
        <svg class="social-icon" viewBox="0 0 48 48" aria-hidden="true">
          <defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffd600"/><stop offset=".35" stop-color="#ff7a00"/><stop offset=".65" stop-color="#e1306c"/><stop offset="1" stop-color="#833ab4"/></linearGradient></defs>
          <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#ig)"/>
          <rect x="12" y="12" width="24" height="24" rx="7" fill="none" stroke="#fff" stroke-width="3.2"/>
          <circle cx="24" cy="24" r="5.5" fill="none" stroke="#fff" stroke-width="3.2"/>
          <circle cx="34" cy="14" r="2.1" fill="#fff"/>
        </svg>
      </span>
      <span>@goldi_gamerr</span>
      <span class="social-link" aria-label="YouTube">
        <svg class="youtube-icon" viewBox="0 0 64 46" aria-hidden="true">
          <rect x="2" y="3" width="60" height="40" rx="11" fill="#ff0033"/>
          <path d="M26 13.5 44 23 26 32.5Z" fill="#fff"/>
        </svg>
      </span>
    </div>
  </header>

  <section class="hub">
    <div class="grid" id="rewardGrid"></div>
    <div class="uid-wrap">
      <input id="uid" class="uid" inputmode="numeric" maxlength="20" placeholder="Enter Game UID" aria-label="Game UID">
    </div>
    <button id="claim" class="claim" type="button">CLAIM REWARD</button>
    <p class="hint">✨ Tap any reward card to select ✨</p>
  </section>
</main>

<button class="gear" id="adminOpen" type="button" aria-label="Open Admin Panel">
  <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
    <path d="M12 8.1a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8Zm0 2a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8Z" fill="currentColor"/>
    <path d="m19.1 13.2 1.4 1.1-1.8 3.1-1.7-.7a7.4 7.4 0 0 1-1.4.8l-.3 1.8h-3.6l-.3-1.8a7.4 7.4 0 0 1-1.4-.8l-1.7.7-1.8-3.1 1.4-1.1a7.6 7.6 0 0 1 0-2.4L6.5 9.7l1.8-3.1 1.7.7a7.4 7.4 0 0 1 1.4-.8l.3-1.8h3.6l.3 1.8a7.4 7.4 0 0 1 1.4.8l1.7-.7 1.8 3.1-1.4 1.1a7.6 7.6 0 0 1 0 2.4ZM14.2 6.7h-4.4l-.3 1.7-.7.3-1.6-.6-.9 1.5 1.3 1-.2.8-1.3 1 1.3 1-.1.8-1.3 1 .9 1.5 1.6-.6.7.3.3 1.7h4.4l.3-1.7.7-.3 1.6.6.9-1.5-1.3-1 .2-.8 1.3-1-1.3-1 .2-.8 1.3-1-.9-1.5-1.6.6-.7-.3-.3-1.7Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
</button>
<div class="toast" id="toast" role="status"></div>

<!-- Admin panel -->
<div class="modal" id="adminModal" aria-hidden="true">
  <section class="admin">
    <div class="admin-head">
      <h2>ADMIN PANEL</h2>
      <button class="back" id="adminBack" type="button">Back</button>
    </div>
    <div class="admin-grid" id="adminGrid"></div>
    <div class="admin-actions">
      <button class="save" id="saveChanges" type="button">Save Changes</button>
      <button class="reset" id="resetImages" type="button">Reset Images</button>
    </div>
  </section>
</div>

<!-- Self-contained page: reward images are embedded, so GitHub Pages does not need separate image files. -->
<div class="success-modal" id="successModal" aria-hidden="true">
  <div class="success-rain" id="successRain"></div>
  <section class="success-box">
    <div class="success-emoji">🎉 🎁</div>
    <div class="success-title">SUCCESS!</div>
    <div class="success-sub">Your reward has been claimed</div>
    <button class="success-back" id="successBack" type="button">Back to Rewards</button>
  </section>
</div>
